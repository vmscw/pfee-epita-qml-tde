<!doctype html>
<html
    lang="en"
    data-slide-part="0"
    data-slide-slide="1"
    data-slide-total="6"
    data-slide-prev=""
    data-slide-next="0.2.html"
>
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
        <style>
            .grid-background {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image:
                    linear-gradient(
                        30deg,
                        #f3e8ff 12%,
                        transparent 12.5%,
                        transparent 87%,
                        #f3e8ff 87.5%,
                        #f3e8ff
                    ),
                    linear-gradient(
                        150deg,
                        #f3e8ff 12%,
                        transparent 12.5%,
                        transparent 87%,
                        #f3e8ff 87.5%,
                        #f3e8ff
                    ),
                    linear-gradient(
                        30deg,
                        #f3e8ff 12%,
                        transparent 12.5%,
                        transparent 87%,
                        #f3e8ff 87.5%,
                        #f3e8ff
                    ),
                    linear-gradient(
                        150deg,
                        #f3e8ff 12%,
                        transparent 12.5%,
                        transparent 87%,
                        #f3e8ff 87.5%,
                        #f3e8ff
                    ),
                    linear-gradient(
                        60deg,
                        #f3e8ff 25%,
                        transparent 25.5%,
                        transparent 75%,
                        #f3e8ff 75%,
                        #f3e8ff
                    ),
                    linear-gradient(
                        60deg,
                        #f3e8ff 25%,
                        transparent 25.5%,
                        transparent 75%,
                        #f3e8ff 75%,
                        #f3e8ff
                    );
                background-size: 120px 210px;
                background-position:
                    0 0,
                    0 0,
                    60px 105px,
                    60px 105px,
                    0 0,
                    60px 105px;
                opacity: 0.3;
            }

            .logo-left {
                position: absolute;
                top: 80px;
                left: 90px;
                display: flex;
                gap: 100px;
                align-items: center;
                z-index: 10;
            }

            .logo {
                height: 80px;
                width: auto;
                scale: 1.5;
                display: block;
            }

            .quantum-logo {
                position: absolute;
                top: 250px;
                right: 120px;
                height: 180px;
                width: auto;
                transform: rotate(18deg) skew(-4deg);
                z-index: 15;
                filter: drop-shadow(0 15px 25px rgba(76, 29, 149, 0.3));
                opacity: 0.95;
                pointer-events: none;
            }

            .title-box {
                position: absolute;
                top: 30%;
                left: 50%;
                transform: translateX(-50%) rotate(-6deg) skew(6deg);
                background: #4c1d95;
                padding: 40px 60px;
                box-shadow: 25px 25px 0px #c084fc;
                border: 7px dotted #c084fc;
                text-align: center;
                min-width: 550px;
                box-sizing: border-box;
                z-index: 5;
            }

            .main-title {
                font-size: 75px;
                font-weight: 800;
                color: #ffffff;
                line-height: 1.3;
                text-transform: uppercase;
                margin: 2rem 0 2rem 0;
            }

            .subtitle-container {
                position: absolute;
                bottom: 70px;
                left: 90px;
                right: 90px;
                border-top: 3px solid #4c1d95;
                padding-top: 20px;
                text-align: center;
                z-index: 5;
            }

            .subtitle {
                font-size: 34px;
                font-weight: 600;
                color: #374151;
                margin: 0;
            }

            .accent-polygon {
                position: absolute;
                top: 100px;
                right: -30px;
                width: 450px;
                height: 450px;
                background: rgba(192, 132, 252, 0.15);
                clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
                transform: rotate(15deg);
                z-index: 0;
            }
        </style>

        <script src="nav.js" defer=""></script>
    </head>

    <body>
        <div class="slide page-1">
            <div class="logo-left">
                <img src="assets/epita_logo.webp" class="logo" alt="EPITA Logo" />
                <img src="assets/scaleway_logo.webp" class="logo" alt="Scaleway Logo" />
            </div>
            <img
                src="assets/epita_quantum_major_logo.jpg"
                class="quantum-logo"
                alt="EPITA Quantum Major Logo"
            />
            <div class="grid-background"></div>
            <div class="accent-polygon"></div>

            <div class="title-box">
                <h1 class="main-title">
                    hybrid quantum
                    <br />
                    machine learning
                    <br />
                    for tabular data
                </h1>
            </div>
            <div class="subtitle-container">
                <p class="subtitle">
                    PFEE Presentation | EPITA Quantum Major &amp; Scaleway Partnership
                </p>
            </div>
        </div>

        <!-- slide-indicator will be injected by update-slides.js -->

        <div class="slide-indicator">1/6</div>
    </body>
</html>
